# Builds a binary for every target the crate declares and publishes them to npm
# as one launcher package plus one package per platform, publishes the crate to
# crates.io, and then records the release on GitHub with its changelog and an
# archive of each binary.
#
# Both registries authenticate this workflow by OIDC rather than by a token,
# and the trusted publisher each holds is pinned to this repository *and to this
# file name*. Renaming this file revokes publishing until both pins are updated.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # The version of the generator, pinned so a release is reproducible.
  CARGO_NPM_VERSION: "0.1.4"
  # tree-sitter-scss hands its C compiler a GCC-style warning flag
  # unconditionally, and cl.exe rejects it. clang-cl reads that flag and the
  # MSVC ones alike, so the Windows target is compiled with it.
  CC_x86_64_pc_windows_msvc: clang-cl

jobs:
  # First, so a mistyped tag costs seconds rather than a full build.
  version:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Check the tag against the declared version
        run: |
          declared=$(python3 -c 'import tomllib; print(tomllib.load(open("Cargo.toml", "rb"))["package"]["version"])')
          tagged=${GITHUB_REF_NAME#v}
          if [ "$declared" != "$tagged" ]; then
            echo "Cargo.toml declares $declared and the tag says $tagged." >&2
            exit 1
          fi

  build:
    name: ${{ matrix.target }}
    needs: version
    runs-on: ${{ matrix.runner }}
    strategy:
      # Every target has to succeed. A missing binary must stop the release
      # rather than publish a launcher that is quietly short a platform.
      fail-fast: true
      matrix:
        include:
          - { target: x86_64-unknown-linux-gnu, runner: ubuntu-24.04 }
          - { target: aarch64-unknown-linux-gnu, runner: ubuntu-24.04-arm }
          - { target: aarch64-apple-darwin, runner: macos-15 }
          - { target: x86_64-pc-windows-msvc, runner: windows-2025, ext: .exe }

    steps:
      - uses: actions/checkout@v4

      - run: rustup target add ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      # Each target is native to the runner it is built on, so the tests run
      # where the binary will. A release cannot ship a platform whose tests
      # did not pass on that platform.
      - run: cargo test --release --locked --target ${{ matrix.target }}

      - run: cargo build --release --locked --target ${{ matrix.target }}

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: target/${{ matrix.target }}/release/fallout${{ matrix.ext }}
          if-no-files-found: error

  npm:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      # The OIDC token npm exchanges for a short-lived publish grant. This is
      # the whole of the credential: there is no NPM_TOKEN, and without this
      # permission npm falls back to looking for one and fails.
      id-token: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      # Trusted publishing needs npm 11.5.1 or later. What a Node release
      # bundles is whatever was current when it shipped, so ask for it rather
      # than assume it. No registry-url and no NODE_AUTH_TOKEN: an .npmrc
      # naming a token is what sends npm down the token path instead of OIDC.
      - run: npm install -g npm@latest

      - run: cargo install cargo-npm --locked --version ${{ env.CARGO_NPM_VERSION }}

      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Lay the binaries out the way the generator reads them
        run: |
          for built in artifacts/*/; do
            triple=$(basename "$built")
            mkdir -p "dist/$triple/release"
            cp "$built"* "dist/$triple/release/"
          done
          # Artifacts travel as zip entries and zip does not carry the
          # executable bit. Without this the launcher spawns the binary and
          # gets EACCES on every platform but Windows.
          chmod +x dist/*/release/*

      - run: cargo npm generate --clean --target-dir dist

      # `generate` is content to write a platform package with no binary in
      # it, so check before anything reaches the registry. A published version
      # cannot be replaced.
      - name: Check every platform package carries a binary
        run: |
          declared=$(python3 -c 'import tomllib; print(len(tomllib.load(open("Cargo.toml", "rb"))["package"]["metadata"]["npm"]["targets"]))')
          found=0
          missing=0
          for package in npm/@*/*/; do
            [ -d "$package" ] || continue
            found=$((found + 1))
            if ! ls "$package" | grep -q '^fallout'; then
              echo "no binary in $package" >&2
              missing=1
            fi
          done
          if [ "$found" != "$declared" ]; then
            echo "Cargo.toml declares $declared targets and $found were generated." >&2
            missing=1
          fi
          exit $missing

      # Publishes each platform package before the launcher that depends on
      # it, and skips any version already on the registry — so re-running
      # after a partial failure finishes the release instead of colliding
      # with it. Scoped packages default to restricted, hence --access.
      - run: cargo npm publish -- --access public --provenance

  # Waits on the same builds as npm, so the crate is only published once every
  # target's tests have passed. The two registries are otherwise independent.
  crates:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      # Exchanged for a crates.io token that expires within the hour and is
      # revoked when the job ends. There is no CARGO_REGISTRY_TOKEN secret.
      id-token: write

    steps:
      - uses: actions/checkout@v4

      - uses: Swatinem/rust-cache@v2

      # `cargo publish` fails on a version the registry already has, unlike
      # the npm side, so ask first. Re-running a release that got partway then
      # finishes it instead of failing here.
      - name: Check whether this version is already on crates.io
        id: published
        run: |
          status=$(curl -s -o /dev/null -w '%{http_code}' \
            -A "fallout release (https://github.com/${GITHUB_REPOSITORY})" \
            "https://crates.io/api/v1/crates/fallout/${GITHUB_REF_NAME#v}")
          case "$status" in
            200) echo "exists=true" >> "$GITHUB_OUTPUT" ;;
            404) echo "exists=false" >> "$GITHUB_OUTPUT" ;;
            *) echo "crates.io answered $status." >&2; exit 1 ;;
          esac

      - uses: rust-lang/crates-io-auth-action@v1
        if: steps.published.outputs.exists == 'false'
        id: auth

      - run: cargo publish --locked
        if: steps.published.outputs.exists == 'false'
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}

  # Last, so a release on GitHub always names a version both registries have.
  github:
    needs: [npm, crates]
    runs-on: ubuntu-24.04
    permissions:
      # Creating a release writes to the repository; nothing else here does.
      contents: write

    steps:
      # The whole history and every tag, to find where the previous release was
      # cut and to list what landed since.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # The changelog is the commit subjects since the previous tag. Changes land
      # on main directly rather than through pull requests, so GitHub's own
      # generated notes, which list merged pull requests, would be empty. The
      # commit that sets the version is left out: the release is that commit.
      - name: Write the changelog
        run: |
          previous=$(git describe --tags --abbrev=0 --match 'v*' "${GITHUB_REF_NAME}^" 2>/dev/null || true)
          range=${previous:+$previous..}$GITHUB_REF_NAME
          {
            if [ -n "$previous" ]; then
              echo "## Changes since $previous"
            else
              echo "## Changes"
            fi
            echo
            git log --no-merges --format='- %s (%h)' \
              --invert-grep --grep='^Release [0-9]' "$range"
            if [ -n "$previous" ]; then
              echo
              echo "**Full diff:** https://github.com/${GITHUB_REPOSITORY}/compare/${previous}...${GITHUB_REF_NAME}"
            fi
          } > changelog.md
          cat changelog.md

      # The same binaries npm shipped, from the build jobs of this run.
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      # One archive per target, named for the version and the triple. tar keeps
      # the executable bit that the artifact zip dropped; Windows has no such
      # bit, and zip is what it opens. Each carries the licenses and the README,
      # and SHA256SUMS covers every archive. Neither format records who built
      # it: the runner's account is nothing a download should carry.
      - name: Archive the binaries
        run: |
          mkdir stage assets
          for built in artifacts/*/; do
            triple=$(basename "$built")
            name=fallout-$GITHUB_REF_NAME-$triple
            mkdir "stage/$name"
            cp "$built"* LICENSE-MIT LICENSE-APACHE README.md "stage/$name/"
            case "$triple" in
              *-windows-*)
                (cd stage && zip -qrX "../assets/$name.zip" "$name") ;;
              *)
                chmod +x "stage/$name/fallout"
                tar -C stage --owner=0 --group=0 --numeric-owner \
                  -czf "assets/$name.tar.gz" "$name" ;;
            esac
          done
          (cd assets && sha256sum -- * > SHA256SUMS)
          ls -l assets

      # A re-run after the release exists refreshes its notes and replaces its
      # archives rather than failing, as the publish jobs finish a partial
      # release rather than colliding with it.
      - name: Create or update the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1; then
            gh release edit "$GITHUB_REF_NAME" --notes-file changelog.md
          else
            gh release create "$GITHUB_REF_NAME" --verify-tag \
              --title "fallout ${GITHUB_REF_NAME#v}" --notes-file changelog.md
          fi
          gh release upload "$GITHUB_REF_NAME" assets/* --clobber
