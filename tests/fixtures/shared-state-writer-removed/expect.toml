affected = true
from = "base"

[anchor.explain]
base = [
    "File(src/pages/ClicksPage.tsx)",
    "Decl(src/pages/ClicksPage.tsx, ClicksPage)",
    "Export(src/state/clicks.ts, clicks)",
]

# `remember` wrote `items` of an object read only for its members, and is gone.
