    "Decl(src/pages/ItemsPage.tsx, ItemsPage)",
    "Member(src/state/lists.ts, lists.items)",
]

# `tags` is a property of its own, which `remember` never wrote. Without a base
# revision, the lines `remember` left fall past the last statement, which marks
# module initialisation, and every importer of the file reaches that.
[[anchor]]
path = "src/pages/TagsPage.tsx"
affected = false
from = "base"

