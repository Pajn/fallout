# A Zustand store written through `setState` by a declaration of its own file. A
# page that uses the store reads what `reset` writes, so an edit to `reset` reaches
# it, though the page never names `reset`. A declaration that only reads a store,
# with `getState`, `getInitialState` or `subscribe`, is no writer of it.

