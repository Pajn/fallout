# A renamed export. The page imports the other one, untouched, and is flagged anyway:
# what changed is the file's export table, and a name that is no longer in it resolves
# to the file rather than to any declaration, so the file is the only honest mark.
#
# The symbol level misses this. A line range sees the new declaration arrive and marks
# it; it cannot see the old name leave, because nothing in the file after the change
# mentions it. Comparing against a base revision is what makes a rename visible, which
# is why the expectation starts there.
[[anchor]]
path = "src/pages/DatePage.tsx"
affected = true
from = "base"
