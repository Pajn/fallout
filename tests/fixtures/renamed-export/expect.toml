# A renamed export, and two pages: one that imports the other export and one that
# still asks for the old name. The rename has to reach the second and not the first,
# which is the whole reason a departed name is a node of its own rather than a mark
# on the file.
#
# `LegacyPage` is left calling a name that no longer exists. That is broken code, and
# deliberately so: the soundness question is exactly what happens to a consumer the
# change forgot to update, and a consumer the change *did* update would be in the
# diff and marked for its own sake.
