# In the app bundled with inline requires, importing a module evaluates nothing
# until one of its names is read. A case that reads only the constant beside a
# store evaluates the store's module, and so makes the store, but an edit to the
# store's initial state still does not reach it.
[[anchor]]
path = "src/inline/cases/plain.cases.tsx"
affected = false

# A creator reads `DEFAULT_STEP` when its store is made, which is when the store's
# module is evaluated, so a case that reads only the constant beside the store
# evaluates the config module too. A creator that reads an import is therefore
# not quiet here, and making the store is initialisation, whose reads are followed
# as any are. A top-level call added to the config module reaches that case,
# although nothing it reads depends on the store.
