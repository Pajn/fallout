# Zustand stores, one per scenario, each in a module of its own beside a constant
# `TITLE`, with a case of its own that reads only that constant. Every store's
# initial state is edited, and no case reads more than one store's module, so each
# title case answers for its own scenario alone. One case uses every store.
#
# `src/shim` has a tsconfig that maps `zustand` to a file of the app, and
# `src/inline` is an app bundled with inline requires.

# The ways Zustand offers to make a store, and the ways an app reaches them.
# Creating a store calls its creator, and each creator here only builds an object
# of state and actions, so loading the module runs nothing observable, and an edit
# to the store does not reach a case that reads only the constant beside it.

