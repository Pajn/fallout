# A `Map`, an array and a `Set`, each a module-scope `const` made in its file,
# read by two declarations and written by a third.
#
# A method that only reads a collection whose type the file shows is a read, so
# a declaration that only calls one is no writer that every other reader of the
# collection reaches. A method that hands out what the collection holds is a read
# only where that is used in place, and a callback it is given only where it is
# an arrow that reads what it is handed in place.

# In reads.ts, a declaration that compares what `cache.get` hands out is edited.
# `isCached` only calls `cache.has`, and nothing the edited declaration does can
# change what `cache` holds.
[[anchor]]
path = "src/pages/MapReadPage.tsx"
affected = false

