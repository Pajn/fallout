# The other half of the same claim. Deferring an import does not delete the work a
# module does when it is evaluated — it moves it to whoever first uses one of the
# module's names. `Badge` calls `warn`, so reaching `Badge` is what evaluates
# `logger.ts`, and the top-level call in that file is reached through the export
# rather than through the import.
#
# Read together with `inline-requires`: the same setting must lose the page that only
# imports and keep the page that uses.
