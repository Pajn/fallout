# A top-level statement that declares nothing runs for its effect when its module is
# evaluated, and here it writes the page's title from `base`. A page that imports only
# `label` still evaluates `banner.ts`, so an edit to the value of `base` changes what
# it shows. Module initialisation reaches the export the statement reads, not only
# the initialisation of the module it comes from, which evaluating `base` does not
# change.
