# The soundness half of require-asset. A `require` hands back the whole export
# object, so the declaration holding it depends on every export of the target: a
# change to one the page really does reach must flag.
#
# The same edge flags a change to `spare`, which the page never calls. Widening to
# all exports is the price of not knowing which property the call site reads.
#
# The path runs through module initialisation because a `require` is a call, so the
# declaration holding its result is computed when the module is evaluated.
[[anchor]]
path = "src/pages/WidgetPage.tsx"
affected = true

[anchor.explain]
symbol = [
    "File(src/pages/WidgetPage.tsx)",
    "ModuleInit(src/pages/WidgetPage.tsx)",
    "ModuleInit(src/components/Widget.tsx)",
    "Decl(src/components/Widget.tsx, math)",
    "Export(src/legacy/math.js, compute)",
]
