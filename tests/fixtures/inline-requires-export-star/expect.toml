path = "src/page.ts"
affected = true

[anchor.explain]
symbol = [
    "File(src/page.ts)",
    "Decl(src/page.ts, Page)",
    "Export(src/barrel.ts, x)",
    "ModuleInit(src/barrel.ts)",
    "ModuleInit(src/polyfill.ts)",
]
