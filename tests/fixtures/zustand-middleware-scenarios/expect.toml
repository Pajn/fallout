# Zustand stores wrapped in middleware, one per scenario, each in a module of its
# own beside a constant `TITLE`, with a case of its own that reads only that
# constant. Every store's initial state is edited, unless its scenario says
# otherwise, and no case reads more than one store's module, so each title case
# answers for its own scenario alone. One case uses every store.
#
# `src/inline` is an app bundled with inline requires.

# Middleware recognised as a wrapper: calling it only builds the creator it
# returns, and calling that creator calls the one it wraps. Each creator here only
# builds an object of state and actions, so loading the module runs nothing
# observable, and an edit to the store does not reach a case that reads only the
# constant beside it.

