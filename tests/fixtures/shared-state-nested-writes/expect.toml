# A value used as a whole, a `let` that is reassigned in state.ts and the result
# of a call in queue.ts, written by a method called two and three levels below
# the binding, and a reassigned `let` in list.tsx, part of which is handed to a
# component.
#
# A write or a method call anywhere down a member chain rooted at the value is a
# write of the value, and so is handing it or part of it to a component, so the
# edited writer reaches every declaration that reads it, however shallow the
# read.

# `add` calls `state.items.push`, and `count` reads `state.items.length`.
