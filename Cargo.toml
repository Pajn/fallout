[package]
name = "fallout"
version = "0.0.0"
edition = "2024"
description = "Decide whether a set of changed files can reach a page, by walking the JavaScript and TypeScript import graph"
repository = "https://github.com/Pajn/fallout"
license = "MIT OR Apache-2.0"
readme = "README.md"
keywords = ["javascript", "typescript", "monorepo", "imports", "testing"]
categories = ["command-line-utilities", "development-tools::testing"]
exclude = ["/docs"]

[package.metadata.npm]
name = "fallout-cli"
prefix = "@fallout-cli/"
targets = [
    "x86_64-unknown-linux-gnu",
    "aarch64-unknown-linux-gnu",
    "aarch64-apple-darwin",
    "x86_64-pc-windows-msvc",
]

[dependencies]
oxc_allocator = "0.147"
oxc_parser = "0.147"
oxc_ast = "0.147"
oxc_ast_visit = "0.147"
oxc_span = "0.147"
oxc_resolver = "11"
petgraph = "0.8"
walkdir = "2.5"
clap = { version = "4.6", features = ["derive"] }
rayon = "1.10"
dashmap = "6.1"
ahash = "0.8"

[dev-dependencies]
tempfile = "3.10"
